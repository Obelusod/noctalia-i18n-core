[project]
name = "noctalia-i18n-core"
version = "0.4.0"
description = "Read project progress, current translations, and changes from Noctalia Translate"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Obelus" }]
keywords = ["i18n", "localization", "noctalia", "translations"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Software Development :: Internationalization",
  "Topic :: Software Development :: Libraries :: Python Modules",
  "Typing :: Typed",
]
dependencies = [
  "requests>=2.32",
  "urllib3>=1.26",
]

[project.urls]
Homepage = "https://github.com/Obelusod/noctalia-i18n-core"
Issues = "https://github.com/Obelusod/noctalia-i18n-core/issues"
Source = "https://github.com/Obelusod/noctalia-i18n-core"

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
  "pyrefly>=1.4.0",
  "ruff>=0.16.2",
]

[tool.pyrefly]
project-includes = ["noctalia_i18n_core", "tests"]
python-version = "3.12"
preset = "strict"
min-severity = "warn"
search-path = ["."]
infer-with-first-use = false
type-ignore-unknown-tag-behavior = "no-effect"

[tool.pyrefly.errors]
explicit-any = "error"
unreachable = "error"
unreachable-match-case = "error"
unknown-argument-type = "error"
unknown-variable-type = "error"
unknown-return-type = "error"
unknown-attribute-access = "error"
unknown-attribute-type = "error"

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = [
  "A", "ANN", "ARG", "B", "C4", "E4", "E7", "E9", "F", "I", "PGH003",
  "RUF006", "RUF007", "RUF008", "RUF009", "RUF012", "RUF013", "RUF100",
  "SIM", "UP",
]

[tool.hatch.build.targets.wheel]
packages = ["noctalia_i18n_core"]

[tool.hatch.build.targets.sdist]
include = [
  "LICENSE",
  "README.md",
  "README.zh-CN.md",
  "noctalia_i18n_core",
  "pyproject.toml",
  "tests",
]
