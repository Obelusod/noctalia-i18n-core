name: Publish

on:
  release:
    types:
      - published

permissions:
  contents: read

concurrency:
  group: publish-${{ github.event.release.tag_name }}
  cancel-in-progress: false

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Check out release
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.event.release.tag_name }}
      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "0.12.0"
          enable-cache: false
          python-version: "3.12"
      - name: Verify release version
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          PACKAGE_VERSION="$(uv version --short)"
          test "$RELEASE_TAG" = "v$PACKAGE_VERSION"
          git merge-base --is-ancestor HEAD origin/main
      - name: Install development environment
        run: uv sync --locked
      - name: Check project
        run: |
          uv run --no-sync ruff format --check .
          uv run --no-sync ruff check .
          uv run --no-sync basedpyright
          uv run --no-sync python -m unittest discover -v
      - name: Build distributions
        run: uv build --no-sources --clear
      - name: Check package metadata
        run: uvx --from twine==6.2.0 twine check --strict dist/*
      - name: Test wheel
        run: uv run --isolated --no-project --with dist/*.whl tests/smoke_test.py
      - name: Test source distribution
        run: uv run --isolated --no-project --with dist/*.tar.gz tests/smoke_test.py
      - name: Store distributions
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: python-package-distributions
          path: dist/
          if-no-files-found: error
          retention-days: 1

  publish:
    name: Publish
    needs:
      - build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/noctalia-i18n-core/
    permissions:
      id-token: write
    steps:
      - name: Retrieve distributions
        uses: actions/download-artifact@70fc10c6e5e1ce46ad2ea6f2b72d43f7d47b13c3 # v8.0.0
        with:
          name: python-package-distributions
          path: dist/
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@cef221092ed1bacb1cc03d23a2d87d1d172e277b # v1.14.0
